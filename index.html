<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#140714" />
<title>Роза раскрывается 🌹</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0c0410;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#ffe3ef}
body{overflow:hidden}
.stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 74% 49% at 50% 45%,#5a214e 0%,#2b1027 54%,#100613 100%)}
.stage:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 38%,rgba(5,1,8,.28) 100%)}
/* Auto-typing phrase area */
.phrase-panel{
 position:absolute;z-index:3;left:14px;right:14px;
 bottom:calc(99px + env(safe-area-inset-bottom));
 min-height:79px;display:flex;align-items:center;justify-content:center;
 padding:13px 14px;border-radius:19px;
 background:rgba(32,11,27,.82);
 border:1px solid rgba(255,205,228,.22);
 box-shadow:0 8px 28px rgba(0,0,0,.24), inset 0 1px rgba(255,250,255,.035);
 opacity:0;visibility:hidden;transform:translateY(9px);
 pointer-events:none;transition:opacity .55s ease, transform .55s ease,visibility .55s;
}
.phrase-panel.visible{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
.phrase-center{flex:1;min-width:0;text-align:center}
.phrase-message{font:500 clamp(18px,4.6vw,22px)/1.3 Georgia,serif;color:#fff0f7;
 text-shadow:0 1px 8px rgba(255,150,195,.18);min-height:30px;overflow-wrap:anywhere;letter-spacing:.02em}
.phrase-message.animate{animation:phrase-in .58s ease both}
@keyframes phrase-in{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-height:670px){.phrase-panel{bottom:calc(97px + env(safe-area-inset-bottom));min-height:71px;padding:10px 12px}.phrase-message{font-size:17px}}
.heart-field{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.heart{position:absolute;color:rgba(255,182,214,.34);font-size:12px;line-height:1;transform:translate(-50%,-50%) scale(.9);animation:heartPulse var(--dur,3.2s) ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,110,170,.12))}
@keyframes heartPulse{0%,100%{opacity:.16;transform:translate(-50%,-50%) scale(.78)}50%{opacity:.58;transform:translate(-50%,-50%) scale(1.18)}}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.top{position:absolute;z-index:2;top:max(16px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;pointer-events:none}
.eyebrow{font-size:10px;letter-spacing:.38em;color:#e3a8c5;font-weight:500}
h1{margin:10px 0 8px;font:400 clamp(25px,6.4vw,37px)/1.12 Georgia,serif;color:#ffe0eb;text-shadow:0 3px 20px #ff6fac33}
.sub{display:none}
.bottom{position:absolute;z-index:2;left:10px;right:10px;bottom:max(15px,env(safe-area-inset-bottom));text-align:center}
.bottom small{display:block;color:#cc8eab;font-size:11px;margin-bottom:12px}
.actions{display:flex;gap:9px;align-items:stretch;justify-content:center}
button{border:1px solid #ff9ccf55;border-radius:99px;min-height:47px;padding:12px 15px;color:#ffe3ee;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(120deg,#a13564,#562041);box-shadow:0 6px 25px #d94d8f22}
button.secondary{background:#ffffff0a;border-color:#ffffff27;color:#f2bfd6;font-weight:500}
button:active{transform:scale(.97)}
@media(min-width:650px){.stage{width:min(100%,520px);height:min(100dvh,930px);margin:0 auto;border-radius:16px;box-shadow:0 15px 60px #0008}.top{top:28px}}
@media(max-height:600px){.top{top:6px}.eyebrow{font-size:9px}h1{font-size:22px;margin:4px 0}.bottom{bottom:4px}.bottom small{margin-bottom:5px}button{min-height:37px;padding:8px 11px}}
</style>
</head>
<body>
<main class="stage" id="stage">
<div id="heartField" class="heart-field" aria-hidden="true"></div>
<canvas id="canvas" aria-label="Роза из частиц вырастает из стебля, образует закрытый бутон, затем плавно раскрывается"></canvas>
<div class="top"><div class="eyebrow">Небольшая магия для тебя котик❤</div><h1>Розочка для моей любимой</h1><div id="subtitle" class="sub"></div></div>
<section id="phrasePanel" class="phrase-panel" aria-label="Милые слова после раскрытия розы" aria-hidden="true">
  <div class="phrase-center"><div class="phrase-message" id="phraseMessage"></div></div>
</section>
<div class="bottom"><small>❤</small><div class="actions"><button id="replay" type="button">↻ Собрать заново</button><button id="show" class="secondary" type="button">✦ Показать розу</button></div></div>
</main>

  phraseMessage.classList.add('animate');
  typePhrase(phrase, token, 1);
}
function setPhraseState(show){
  if(show && !phraseVisible){
    phraseVisible=true; phraseIndex=0; phrasePanel.classList.add('visible'); phrasePanel.setAttribute('aria-hidden','false'); phraseMessage.style.opacity='1'; startPhraseCycle();
  }else if(!show && phraseVisible){
    phraseVisible=false; clearPhraseTimers(); typingToken++; phrasePanel.classList.remove('visible'); phrasePanel.setAttribute('aria-hidden','true'); phraseMessage.textContent='';
  }
}
function buildHearts(){
  heartField.innerHTML='';
  const count = W < 420 ? 18 : 26;
  for(let i=0;i<count;i++){
    const el=document.createElement('span');
    el.className='heart'; el.textContent='❤';
    const sidePad=20;
    const x=Math.round(sidePad + Math.random()*(W-sidePad*2));
    const y=Math.round(26 + Math.random()*(H-52));
    const size=(W<420?10:12) + Math.random()*(W<420?8:10);
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.fontSize=size+'px';
    el.style.opacity=(0.12 + Math.random()*0.22).toFixed(2);
    el.style.setProperty('--dur', (2.6 + Math.random()*2.8).toFixed(2)+'s');
    heartField.appendChild(el);
  }
}
const DURATION=12000;
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
let start=performance.now(),elapsed=0,lastStatus='',W=0,H=0,DPR=1,S=1,X=0,Y=0;
subtitle.textContent='';
const packed=Uint8Array.from(atob(POINT_DATA),c=>c.charCodeAt(0));
const n=Math.floor(packed.length/5);
const vertData=new Float32Array(n*8);
const cpu=[];
function rng(i){let x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
for(let i=0;i<n;i++){
 const j=i*5, x=packed[j]|packed[j+1]<<8, y=packed[j+2]|packed[j+3]<<8, c=packed[j+4];
 const kind=y<318?0:(Math.abs(x-(193+Math.sin(y*.018)*5))<19?1:2);
 const seed=rng(i+1),k=i*8,color=SOFT_PALETTE[c]||[246,170,190];
 vertData[k]=x; vertData[k+1]=y;
 vertData[k+2]=color[0]/255; vertData[k+3]=color[1]/255; vertData[k+4]=color[2]/255;
 vertData[k+5]=seed; vertData[k+6]=kind; vertData[k+7]=rng(i*2+5);
 cpu.push({x,y,kind,c,seed,extra:vertData[k+7]});
}
let gl=null,program=null,locations={},ctx=null;
try{gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true,premultipliedAlpha:false})||canvas.getContext('experimental-webgl',{alpha:true,preserveDrawingBuffer:true});}catch(e){gl=null}
function shader(type,src){const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;}
const vertexShader=`
precision highp float;
attribute vec2 a_xy;
attribute vec3 a_color;
attribute float a_seed;
attribute float a_kind;
attribute float a_extra;
uniform vec2 u_size;
uniform vec2 u_offset;
uniform float u_scale;
uniform float u_dpr;
uniform float u_time;
varying vec3 v_color;
varying float v_alpha;
float sat(float x){return clamp(x,0.,1.);}
float smooth(float a,float b,float x){float t=sat((x-a)/(b-a));return t*t*(3.-2.*t);}
void main(){
 vec2 xy=a_xy; float alpha=1.;
 if(a_kind<.5){
   float ny=sat((320.-xy.y)/320.);
   float xn=clamp((xy.x-193.)/177.,-1.,1.);
   float wide=5.+34.*pow(max(0.,sin(3.14159*(.07+ny*.86))),.66);
   vec2 bud=vec2(193.+xn*wide+sin(ny*7.+a_seed*4.)*1.4, 319.-ny*143.+abs(xn)*5.);
   float startBuild=2.45+a_seed*.57;
   float built=smooth(startBuild,startBuild+1.38,u_time);
   vec2 spark=vec2(193.+(a_seed-.5)*18.,314.+a_extra*18.);
   vec2 formed=mix(spark,bud,built);
   float radial=sat(length((xy-vec2(193.,157.))/vec2(200.,170.)));
   float delay=(1.-radial)*.25;
   float opened=smooth(6.05+delay*5.,11.6+delay*2.,u_time);
   vec2 pos=mix(formed,xy,opened);
   alpha=built;
   // Unfolding edges quiver gently while the bloom opens.
   pos.x+=sin(a_seed*24.+u_time*3.7)*.8*opened*(1.-opened);
   pos.y-=cos(a_extra*16.+u_time*2.8)*.6*opened*(1.-opened);
   xy=pos;
 }else if(a_kind<1.5){
   float fromBottom=sat((559.-xy.y)/245.);
   float height=smooth(.03,2.38,u_time);
   alpha=1.-smooth(height-.045,height+.045,fromBottom);
 }else{
   alpha=smooth(2.2+a_seed*.8,3.7+a_seed*.7,u_time);
 }
 vec2 pix=(u_offset+xy*u_scale);
 vec2 clip=(pix/u_size)*2.-1.;
 gl_Position=vec4(clip.x,-clip.y,0.,1.);
 gl_PointSize=(1.12+a_extra*1.60)*u_dpr*u_scale;
 v_color=a_color;
 v_alpha=alpha*(.76+.24*a_extra);
}`;
const fragmentShader=`
precision mediump float;
varying vec3 v_color;
varying float v_alpha;
void main(){
 vec2 uv=gl_PointCoord*2.-1.;
 float d=dot(uv,uv);
 if(d>1.) discard;
 float edge=1.-smoothstep(.24,1.,d);
 gl_FragColor=vec4(v_color,max(0.,min(1.,v_alpha*edge)));
}`;
try{
 if(!gl)throw new Error('WebGL недоступен');
 const v=shader(gl.VERTEX_SHADER,vertexShader),f=shader(gl.FRAGMENT_SHADER,fragmentShader);
 program=gl.createProgram();gl.attachShader(program,v);gl.attachShader(program,f);gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
 gl.useProgram(program);
 const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,vertData,gl.STATIC_DRAW);
 const stride=8*4;
 const attr=(name,size,offset)=>{const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,stride,offset*4)};
 attr('a_xy',2,0);attr('a_color',3,2);attr('a_seed',1,5);attr('a_kind',1,6);attr('a_extra',1,7);
 for(const s of ['u_size','u_offset','u_scale','u_dpr','u_time'])locations[s]=gl.getUniformLocation(program,s);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
}catch(e){console.warn('Используем резервную Canvas-анимацию',e);gl=null;ctx=canvas.getContext('2d');}
function fit(){
 const r=stage.getBoundingClientRect();W=r.width;H=r.height;
 DPR=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 const top=Math.max(H<670?106:117,H*.18),bottom=H<670?174:196;
 S=Math.min((W-18)/382,(H-top-bottom)/559,1.38);
 S=Math.max(.32,S);X=(W-382*S)/2;Y=top+Math.max(0,(H-top-bottom-559*S)/2);
 if(gl){gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(program);
  gl.uniform2f(locations.u_size,W,H);gl.uniform2f(locations.u_offset,X,Y);
  gl.uniform1f(locations.u_scale,S);gl.uniform1f(locations.u_dpr,DPR);
 }else if(ctx){ctx.setTransform(DPR,0,0,DPR,0,0)}
 buildHearts();
}


function ease(a,b,x){let t=clamp((x-a)/(b-a));return t*t*(3-2*t)}
function draw2d(t){
 ctx.clearRect(0,0,W,H);
 // Scaled fallback: smaller sampled point count to keep old phones responsive.
 for(let i=0;i<cpu.length;i+=2){
  const d=cpu[i];let x=d.x,y=d.y,alpha=1;
  if(d.kind===0){
   const ny=clamp((320-y)/320),xn=clamp((x-193)/177,-1,1),wide=5+34*Math.pow(Math.max(0,Math.sin(Math.PI*(.07+ny*.86))),.66);
   const bx=193+xn*wide+Math.sin(ny*7+d.seed*4)*1.4, by=319-ny*143+Math.abs(xn)*5;
   const k=ease(2.45+d.seed*.57,3.83+d.seed*.57,t),opened=ease(6.05,11.6,t);
   x=(193+(d.seed-.5)*18)*(1-k)+bx*k;
   y=(314+d.extra*18)*(1-k)+by*k;
   x=x*(1-opened)+d.x*opened;y=y*(1-opened)+d.y*opened;alpha=k;
  }else if(d.kind===1){alpha=clamp((ease(.03,2.38,t)-(559-y)/245)*50+.5)}
  else alpha=ease(2.2+d.seed*.8,3.7+d.seed*.7,t);
  if(alpha<.02)continue;
  const c=SOFT_PALETTE[d.c]||[247,180,200];ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${alpha*.88})`;
  ctx.fillRect(X+x*S,Y+y*S,Math.max(1,1.4*S),Math.max(1,1.4*S));
 }
}
function status(t){
 setPhraseState(t>=11.75);
}
let raf=0;
function frame(now){
 elapsed=Math.max(0,(now-start)/1000);
 if(gl){
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(locations.u_time,elapsed);
  gl.drawArrays(gl.POINTS,0,n);
 }else if(ctx)draw2d(elapsed);
 status(elapsed);
 raf=requestAnimationFrame(frame);
}
document.getElementById('replay').addEventListener('click',()=>{start=performance.now(); setPhraseState(false);});
document.getElementById('show').addEventListener('click',()=>{start=performance.now()-DURATION; setPhraseState(true);});
window.addEventListener('resize',fit);
fit(); setPhraseState(false); raf=requestAnimationFrame(frame);
})();
</script>
</body>
